name: Update fund snapshots

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_limits.py
      - run: python scripts/update_personal.py
      - name: Commit fresh snapshot
        run: |
          if git diff --quiet -- limits.json personal-data.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add limits.json personal-data.js
          git commit -m "Refresh purchase limits and personal fund snapshots"
          git push
